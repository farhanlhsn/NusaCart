# Docker Environment Configuration
spring.application.name=NusaCart

# Database configuration untuk Docker
spring.datasource.url=jdbc:mysql://database:3306/nusacart?useSSL=false&serverTimezone=UTC
spring.datasource.username=nusacart
spring.datasource.password=Atmin@NusaCart@2025

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection pool configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=300000

# Server configuration
server.port=6060

# WhatsApp API configuration
whatsapp.api.url=http://213.210.37.132:3000/send/message
whatsapp.api.username=admin
whatsapp.api.password=NusaCart@OTP@2025

# Logging configuration
logging.level.com.TryCatch.NusaCart.security.JwtAuthenticationFilter=INFO
logging.level.com.TryCatch.NusaCart.service.AuthService=INFO
logging.level.org.springframework.web.servlet.resource.ResourceHttpRequestHandler=WARN
logging.level.root=INFO

# Upload configuration
app.upload.dir=/app/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Health check endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always 