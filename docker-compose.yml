version: '3.8'

# Docker Compose untuk integrasi dengan Caddy lokal yang sudah ada
# Tidak ada konflik port, hanya expose internal services

services:
  # Database MySQL
  database:
    image: mysql:8.0
    container_name: nusacart-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Atmin@NusaCart@2025
      MYSQL_DATABASE: nusacart
      MYSQL_USER: nusacart
      MYSQL_PASSWORD: Atmin@NusaCart@2025
    ports:
      - "127.0.0.1:3306:3306"  # Only localhost access
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nusacart-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nusacart-backend
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/nusacart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=nusacart
      - SPRING_DATASOURCE_PASSWORD=Atmin@NusaCart@2025
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - APP_UPLOAD_DIR=/app/uploads
      - JWT_SECRET=NusaCartSecretKeyForJWTTokenGeneration2025VeryLongAndSecure
      - JWT_EXPIRATION=86400000
      - WHATSAPP_API_URL=http://213.210.37.132:3000/send/message
      - WHATSAPP_API_USERNAME=admin
      - WHATSAPP_API_PASSWORD=NusaCart@OTP@2025
    ports:
      - "127.0.0.1:6060:6060"  # Only localhost access
    volumes:
      - ./backend/uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - nusacart-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/api/products"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend React (served by simple HTTP server)
  frontend:
    build:
      context: ./Frontend/NusaCart
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:6060
    container_name: nusacart-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Only localhost access
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nusacart-network

volumes:
  mysql_data:
  backend_logs:

networks:
  nusacart-network:
    driver: bridge 