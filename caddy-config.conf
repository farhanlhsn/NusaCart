# Contoh Caddyfile untuk integrasi dengan Docker containers
# Tambahkan konfigurasi ini ke Caddyfile sistem Anda

# Untuk development/testing dengan IP
your-vps-ip {
    # API requests ke backend container
    @api {
        path /api/*
    }
    reverse_proxy @api localhost:6060 {
        health_uri /api/products
        health_interval 30s
        health_timeout 5s
    }
    
    # File uploads ke backend container
    @uploads {
        path /uploads/*
    }
    reverse_proxy @uploads localhost:6060
    
    # Frontend dari container
    reverse_proxy localhost:3000 {
        health_uri /health
        health_interval 30s
        health_timeout 5s
    }
    
    # Security headers
    header {
        X-XSS-Protection "1; mode=block"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        Referrer-Policy "no-referrer-when-downgrade"
        -Server
    }
    
    # Rate limiting
    rate_limit @api {
        zone api
        key {remote_host}
        events 100
        window 1m
    }
    
    # Logging
    log {
        output file /var/log/caddy/nusacart.log
        format json
    }
}

# Untuk production dengan domain + auto HTTPS
nusacart.yourdomain.com {
    # API requests ke backend container
    @api {
        path /api/*
    }
    reverse_proxy @api localhost:6060 {
        health_uri /api/products
        health_interval 30s
        health_timeout 5s
    }
    
    # File uploads ke backend container
    @uploads {
        path /uploads/*
    }
    reverse_proxy @uploads localhost:6060
    
    # Frontend dari container
    reverse_proxy localhost:3000 {
        health_uri /health
        health_interval 30s
        health_timeout 5s
    }
    
    # Security headers untuk HTTPS
    header {
        X-XSS-Protection "1; mode=block"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        Referrer-Policy "no-referrer-when-downgrade"
        Strict-Transport-Security "max-age=31536000; includeSubDomains"
        -Server
    }
    
    # Rate limiting
    rate_limit @api {
        zone api
        key {remote_host}
        events 100
        window 1m
    }
    
    # Stricter rate limiting untuk auth endpoints
    @auth {
        path /api/auth/*
    }
    rate_limit @auth {
        zone auth
        key {remote_host}
        events 10
        window 1m
    }
    
    # Logging
    log {
        output file /var/log/caddy/nusacart-production.log
        format json
    }
} 